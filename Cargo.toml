[package]
name = "sql-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono"] }
axum = "0.8.9"
serde = "1.0.229"
serde_yaml = "0.9.34"
chrono = {version = "0.4.45", features = ["serde"]}

